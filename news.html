<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>お問い合わせ</title>

  <link rel="stylesheet"
        href="style.css">

</head>

<body>

  <div id="header"></div>

  <div class="coming-soon"> 作成中 </div>

  <script>

    fetch("header.html")

      .then(response => response.text())

      .then(data => {

        document
          .getElementById("header")
          .innerHTML = data;

        document
          .getElementById("nav-news")
          .classList.add("active");

      });

  </script>

</body>

</html>
