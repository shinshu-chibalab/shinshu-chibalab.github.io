<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HOME</title>

  <link rel="stylesheet" href="style.css">
  <script src="header.js" defer></script>
  <script src="news.js" defer></script>
</head>

<body>

  <div id="header"></div>

  <section class="hero">

    <div class="hero-content">

      <h1>生体運動機能モデリング研究室</h1>

      <p>
        Human Motion Modeling Lab.
      </p>

      <video
        class="hero-video"
        src="videos/top-simulation.mp4"
        poster="videos/top-simulation.jpg"
        autoplay muted loop playsinline
        aria-label="筋骨格モデルによる前かがみ動作のシミュレーション">
      </video>

      <script>
        // OS で「動きを減らす」設定にしている閲覧者には自動再生しない
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.querySelector(".hero-video").pause();
        }
      </script>

    </div>

  </section>

  <main>

    <section class="card">

      <h2>News &amp; Topics</h2>

      <ul class="news-list" data-limit="5"></ul>

      <a href="news.html" class="more-link">一覧を見る</a>

    </section>

    <section class="card">

      <h2>研究概要</h2>

      <p>
        作成中
      </p>

    </section>

  </main>

</body>
</html>
